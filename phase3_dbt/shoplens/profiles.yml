# Warehouse connection. Switching to Snowflake/BigQuery only requires changing this file
# (type, account, ...); model SQL stays almost the same.
shoplens:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../../warehouse/shoplens_elt.duckdb') }}"
      threads: 4
