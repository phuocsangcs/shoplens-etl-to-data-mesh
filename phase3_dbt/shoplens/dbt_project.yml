# dbt project config: where models live, how each layer is materialized, and which schema it goes to.
name: shoplens
version: "1.0.0"
profile: shoplens            # profile name in profiles.yml (which warehouse to connect to)

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

models:
  shoplens:
    # Layer 1: staging = clean 1-1 with source tables (replaces transform.py from phase 1)
    staging:
      +materialized: view    # VIEW: no storage, always reflects the latest raw data
      +schema: staging
    # Layer 2: intermediate = reusable in-between steps
    intermediate:
      +materialized: view
      +schema: intermediate
    # Layer 3: marts = star schema for end users (replaces sql/ from phase 2)
    marts:
      +materialized: table   # TABLE: precomputed, fast to query
      +schema: marts

seeds:
  shoplens:
    +schema: seeds
