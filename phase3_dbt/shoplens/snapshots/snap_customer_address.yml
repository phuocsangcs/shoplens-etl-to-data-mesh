version: 2

# SNAPSHOT = dbt's way of doing SCD Type 2 (keeping change history).
# On every run, dbt compares the current state with the previous capture:
#   - unchanged                -> skip
#   - city/state/zip changed   -> "close" the old row (fill dbt_valid_to) + insert a new row (dbt_valid_to = NULL)
# Result: one person can have SEVERAL rows, each a "version" of the address with its validity period.
#
# strategy: check     -> compare column values (use when the source has NO updated_at, like Olist)
# strategy: timestamp -> rely on an updated_at column (faster, use when the source has one)
snapshots:
  - name: snap_customer_address
    relation: ref('int_customer_latest_address')
    description: Address history per person (SCD Type 2)
    config:
      schema: snapshots
      unique_key: customer_unique_id
      strategy: check
      check_cols: [city, state, zip_code_prefix]
