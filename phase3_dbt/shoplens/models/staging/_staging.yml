version: 2

# Docs + TESTS for the staging layer. `dbt build` runs tests right after building each model;
# a failing test stops downstream models, so bad data never reaches the marts.
models:
  - name: stg_customers
    description: One row per customer_id (per order). City names normalized.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: The real ID of a person
        data_tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        description: English name; 'unknown' when the source is NULL
        data_tests: [not_null]

  - name: stg_geolocation
    description: One row per zip code
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_order_payments
    columns:
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card]

  - name: stg_order_reviews
    description: Latest review per order
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
