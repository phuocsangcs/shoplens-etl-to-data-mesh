version: 2

# SOURCE = declares raw tables loaded by the EL step (schema raw).
# Models use {{ source('olist', 'orders') }} instead of hard-coding raw.orders,
# so dbt knows the lineage: where data comes from and where it goes.
sources:
  - name: olist
    schema: raw
    description: As-is copy of the Olist production DB (Postgres), loaded by el_raw.py
    tables:
      - name: customers
        description: One row per customer_id (a NEW id for EVERY order, not one per person)
      - name: sellers
      - name: products
      - name: product_category_name_translation
      - name: orders
      - name: order_items
      - name: order_payments
      - name: order_reviews
        description: review_id is NOT unique; one order can have several reviews
      - name: geolocation
        description: Many rows per zip code, inconsistent city spelling
