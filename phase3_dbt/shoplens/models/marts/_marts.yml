version: 2

# Docs + tests for the star schema. Replaces the CHECKS dict in build_star.py (phase 2).
# `dbt docs generate` turns these descriptions into a docs website with a lineage graph.
models:
  - name: dim_date
    description: Calendar 2016-2018, one row per day
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_customer
    description: >
      SCD Type 2. One row = one address version of one person (customer_unique_id).
      Filter is_current = true to get the current address.
    columns:
      - name: customer_key
        description: Surrogate key of the VERSION (dbt_scd_id)
        data_tests: [unique, not_null]
      - name: valid_from
        description: When this version became valid
      - name: valid_to
        description: When this version stopped being valid (9999-12-31 if still current)

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]

  - name: dim_seller
    columns:
      - name: seller_key
        data_tests: [unique, not_null]

  - name: fact_order_items
    description: "GRAIN: one item in one order. Incremental on order_purchase_timestamp."
    data_tests:
      - unique:
          arguments:
            column_name: "order_id || '-' || order_item_id"
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: order_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_payments
    description: "GRAIN: one payment"
    data_tests:
      - unique:
          arguments:
            column_name: "order_id || '-' || payment_sequential"

  - name: fact_orders
    description: "GRAIN: one order, tracking its lifecycle (purchase -> approval -> delivery)"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
